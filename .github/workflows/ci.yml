name: CI

# 推送到任何分支、提交 PR 时运行;也允许被其他工作流调用(docker.yml 会用到)
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 单元测试和集成测试一起跑;集成测试会启动真正的 Gitlet 进程
      - name: Test (with coverage)
        run: >
          dotnet test tests
          --collect:"XPlat Code Coverage"
          --results-directory tests/TestResults

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/TestResults/**/coverage.cobertura.xml

  docker-build:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只构建、不推送,用来确认 Dockerfile 没问题
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gitlet:ci

      - name: Run the image
        run: |
          output="$(docker run --rm gitlet:ci)"
          echo "$output"
          test "$output" = "Please enter a command."
